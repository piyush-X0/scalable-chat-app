services:
  redis:
    image: redis:8

  ws1:
    build: ./user-app
    environment:
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  ws2:
    build: ./user-app
    environment:
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./user-app/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ws1
      - ws2